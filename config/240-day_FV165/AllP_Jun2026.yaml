cd config: ''
# Fit options configuration

fit_options:
  is_data: True
  sin2_th13_opt: pull # Sin2_theta13 option
  pull_all: true
  osc_formula_opt: default # Oscillation formula option, default is PDG, YB is yellowbook
  PDG_opt: NuFitLBL #PDG2025 #DYB #PDG option
  NMO_opt: True # NMO option, true is normal
  NMO_sig: False
  stat_method_opt: CNP #NorP, CNP, or bayesian
  grid_scan: false # if not grid scan, iminuit is run
  plot_minuit_matrix: false
  plot_correlation: true
  plot_minuit_profiles: false
  plot_spectra: true
  print_minuit_correlation: false
  run_hesse: True
  solar_contour: false
  CI_powers: False
  osc_per_core: True # oscillate each core flux at its own baseline and sum, instead of summing fluxes and oscillating with power/L^2 shares
  calc_minuit_errors: False
  profile_dm2_31: true
  profile_dm2_31_conditional: true # if true, scan dm2_31 with all other params fixed at best fit (m.profile); if false, profile likelihood (mnprofile)
  profile_points: 1000
  # --- profile splitting (memory): scan one chunk per job, write raw CSV, ---
  #     then merge into the TGraph with combine_profile.py. Defaults = no split.
  profile_nchunks: 1        # number of dm2_31 sub-ranges to split the scan into
  profile_chunk: 0          # which chunk this job does (0 .. nchunks-1)
  profile_csv: ''           # raw (dm2_31,chi2) output CSV for this chunk
  profile_make_graph: true  # set 0 in chunk jobs (graph built by combine step)
  silent_print: false
  geo_spectra: ana
  pull_dm2_31: true
  pull_dm2_31_lbl: false #false
  dm2_31_lbl_err: 0.0265e-03 #  0.035e-03
  dm2_31_lbl: 2.517e-03 #0.0025043000
  theta23: 48.6
  dcp:  285.0
  lin_resp: False
  fit_type: PMOP_combined #geo or PMOP or PMOP_combined (default)
  fit_mode: prefit_wosegs
  save_prefit: True
  use_prefit: True
  prefit_path: ${NODA_BASE}/prefit_data/240_allP_data.npz
  include_tao: True
  include_dyb: True
  geo_fit: true
  apply_bump: true
  geo_fit_type: total #UThfree , mantle or total (default)
  mantle_model: GD
  reac_model: HM
  nd: DYB
  pull_shape: True
  use_dagflow: false
  geo_OPfixed: false
  toymc: false
  ntoys: 1000
  toy_prefix: 0
  toy_batch_size: 8
  minuit_timeout: 600 #s
  toymc_timeout: 600 #s
  #just for the bayesian method, random seeds and chi2 def
  bayes_seed_beg: 481
  bayes_chi2: CNP
  bayes_events: 400
  bayes_nwalkers: 30
  bayes_nprocesses: 16
  ihep_usage: True
  write_output: False
  file_prefix: 'GroupC_lbl_June14-2026'

  FORCE_CALC_RM: true # Force calculation of response matrix
  FORCE_CALC_CM: false # Force calculation of covariance matrices
  PLOT_CM: false # Plot covariance matrices

  backgrounds_yaml: ${NODA_BASE}/config/240-day_FV165/backgrounds_AllP.yaml
  input_data_file: ${NODA_BASE}/data/JUNOInputs2022_05_08.root #data file
  geo_file: ${NODA_BASE}/data/geo_raw_Nov2723.root
  geoU_file: ${NODA_BASE}/data/U238_IHEP.txt
  geoTh_file: ${NODA_BASE}/data/Th232_IHEP.txt
  geo_MC_U_file: ${NODA_BASE}/data/geo_U_promptFV.root
  geo_MC_Th_file: ${NODA_BASE}/data/geo_Th_promptFV.root
  geo_MC_file: ${NODA_BASE}/data/xc_pdfs_2023-08-25.root
  geoU_hist_name: 'geoU'
  geoTh_hist_name: 'geoTh'
  reactor_model: Huber-Mueller

  main_data_folder: ${NODA_BASE}/Geo_sens_Jan14
  cov_matrix_plots_folder: ${NODA_BASE}/CMplots #folder to store CM plots
  plots_folder: ${NODA_BASE}/Plots #folder to save plots of spectra
  data_matrix_folder: ${NODA_BASE}/Geo_sens_Jan14 #folder to save or to use csv files of spectra and matrices
  bayes_data_folder: ${NODA_BASE}/Bayesian/npz_files
  bayes_plots_folder: ${NODA_BASE}/Bayesian/Plots

  #start and end points for each parameter in grid space
  grid_params:
    sin2_12: [0.302, 0.312]
    sin2_13: [0.0068, 0.0368]
    dm2_21: [7.47e-5, 7.59e-5]
    dm2_31: [2.515e-3, 2.543e-3]

  #number of points for each parameter in the grid space
  grid_points: 21

  shape_unc: TAO


  bayes_unc: stat #+eff+r2+crel+snf+noneq+b2b_DYB+abc+nl+bg+me

  sample_size_resp: 10000 #000 # Sample size for response matrix fluctuations
  sample_size_core: 10000 # Sample size for core powers fluctuations
  sample_size_nonl: 10000 # Sample size for non-linearity fluctuations
  sample_size_me: 10000 #00 # Sample size for matter effect fluctuations


