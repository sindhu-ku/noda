# manifest_phases.yaml — one phase ("AllP"), two shells, from ONE common config.
#
# Shape: `common:` points at a single full config (fit options, oscillation
# settings, binning, files, …) shared by every dataset. `phases:` lists each
# dataset; the block name encodes BOTH phase and shell as "phase/shell"
# (e.g. "AllP/S-15"). Each block lists ONLY the keys that change between
# datasets:
#   livetime (stat_opt), detector_efficiency, eff_unc, backgrounds_yaml,
#   reactor power (core_powers / reactor_summary_yaml), detector response
#   matrix (det_resp_file) and values (a,b,c,kB,fC,kI,LY_shared),
#   data_spectrum / data_hist_name.
#
# Flat keys are looked up in juno_inputs, then fit_options, then
# common_det_inputs of the common config and replaced there. To override
# a key in another section (or add a new key), nest it explicitly:
#   "AllP/S-15":
#     tao_inputs:
#       stat_opt: 8.587days
#
# The optional top-level `systematics:` block sets the per-shell/phase
# correlation policy (see bottom).

common: config/240-day_FV165/AllP_7y_proj_NLpull.yaml

