# manifest_phases.yaml — multi-phase fit from ONE common config.
#
# `common:` points at a single full config (fit options, oscillation
# settings, binning, files, …) shared by every phase. Each entry under
# `phases:` lists ONLY the keys that change between phases:
#   livetime (stat_opt), detector_efficiency, eff_unc, backgrounds_yaml,
#   reactor power (core_powers / reactor_summary_yaml), detector response
#   matrix (det_resp_file) and values (a,b,c,kB,fC,kI,LY_shared),
#   data_spectrum / data_hist_name.
#
# Flat keys are looked up in juno_inputs, then fit_options, then
# common_det_inputs of the common config and replaced there. To override
# a key in another section (or add a new key), nest it explicitly:
#   phase1:
#     tao_inputs:
#       stat_opt: 8.587days
#
# A shell can be encoded in the phase name as "phase/shell", e.g.
#   "P25C/FV1": {...}
# The optional top-level `systematics:` block works exactly as in the
# path-per-phase manifest shape.

