config: ''
# Fit options configuration

fit_options:
  is_data: True
  sin2_th13_opt: pull # Sin2_theta13 option
  pull_all: true
  osc_formula_opt: default # Oscillation formula option, default is PDG, YB is yellowbook
  PDG_opt: DYB #PDG option
  NMO_opt: True # NMO option, true is normal
  NMO_sig: False
  stat_method_opt: CNP #NorP, CNP, or bayesian
  grid_scan: false # if not grid scan, iminuit is run
  plot_minuit_matrix: false
  plot_correlation: false
  plot_minuit_profiles: false
  plot_spectra: true
  print_minuit_correlation: false
  run_hesse: True
  solar_contour: false
  CI_powers: False
  calc_minuit_errors: false
  profile_dm2_31: false
  profile_points: 30
  silent_print: false
  geo_spectra: ana
  pull_dm2_31: false
  pull_dm2_31_lbl: false #false
  dm2_31_lbl_err: 0.0265e-03 #  0.035e-03
  dm2_31_lbl: 2.517e-03 #0.0025043000
  theta23: 43.279
  dcp: 212.0
  lin_resp: False
  fit_type: PMOP_combined #geo or PMOP or PMOP_combined (default)
  fit_mode: combined #prefit_wosegs
  save_prefit: True
  use_prefit: False
  prefit_path: /junofs/users/sindhu/NODA/noda/prefit_data/240_allP_data.npz
  include_tao: False
  include_dyb: True
  geo_fit: true
  apply_bump: true
  geo_fit_type: total #UThfree , mantle or total (default)
  mantle_model: GD 
  reac_model: HM 
  nd: DYB
  pull_shape: True
  use_dagflow: false
  geo_OPfixed: false
  toymc: false      
  ntoys: 1000 
  toy_prefix: 0    
  toy_batch_size: 8 
  minuit_timeout: 600 #s
  toymc_timeout: 600 #s
  #just for the bayesian method, random seeds and chi2 def
  bayes_seed_beg: 481
  bayes_chi2: CNP
  bayes_events: 400
  bayes_nwalkers: 30
  bayes_nprocesses: 16
  ihep_usage: True
  write_output: False
  file_prefix: 'GroupC_June032026_'

  FORCE_CALC_RM: true # Force calculation of response matrix
  FORCE_CALC_CM: false # Force calculation of covariance matrices
  PLOT_CM: false # Plot covariance matrices

  backgrounds_yaml: /junofs/users/sindhu/NODA/noda/config/legacy/240-day_FV165/backgrounds_groupA.yaml
  input_data_file: /junofs/users/sindhu/NODA/noda/data/JUNOInputs2022_05_08.root #data file
  geo_file: /junofs/users/sindhu/NODA/noda/data/geo_raw_Nov2723.root
  geoU_file: /junofs/users/sindhu/NODA/noda/data/U238_IHEP.txt
  geoTh_file: /junofs/users/sindhu/NODA/noda/data/Th232_IHEP.txt
