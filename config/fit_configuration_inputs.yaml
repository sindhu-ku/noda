config: ''
# Fit options configuration

fit_options:

  is_data: False
  sin2_th13_opt: pull # Sin2_theta13 option
  pull_all: false
  osc_formula_opt: default # Oscillation formula option, default is PDG, YB is yellowbook
  PDG_opt: PDG2025 # PDG option
  NMO_opt: true  # NMO option, true is normal
  stat_method_opt: CNP #NorP, CNP, or bayesian
  grid_scan: false # if not grid scan, iminuit is run
  plot_minuit_matrix: false
  plot_minuit_profiles: false
  plot_spectra: true
  print_minuit_correlation: false
  calc_minuit_errors: true
  write_results: false
  silent_print: false
  geo_spectra: ana
  fit_type: PMOP_combined #PMOP_combined #geo or PMOP or PMOP_combined (default)
  geo_fit_type: total #UThfree , mantle or total (default)
  mantle_model: GD  
  nd: DYB
  use_dagflow: True
  geo_OPfixed: false
  toymc: false      
  ntoys: 1000 
  toy_prefix: 0    
  toy_batch_size: 8 
  minuit_timeout: 600 #s
  toymc_timeout: 600 #s
  #just for the bayesian method, random seeds and chi2 def
  bayes_seed_beg: 481
  bayes_chi2: CNP
  bayes_events: 400
  bayes_nwalkers: 30
  bayes_nprocesses: 16
  ihep_usage: True

  FORCE_CALC_RM: true # Force calculation of response matrix
  FORCE_CALC_CM: false # Force calculation of covariance matrices
  PLOT_CM: false # Plot covariance matrices


  input_data_file: /junofs/users/sindhu/NODA/noda/data/JUNOInputs2022_05_08.root #data file
  geo_file: /junofs/users/sindhu/NODA/noda/data/geo_raw_Nov2723.root
  geo_MC_U_file: /junofs/users/sindhu/NODA/noda/data/geo_U_promptFV.root
  geo_MC_Th_file: /junofs/users/sindhu/NODA/noda/data/geo_Th_promptFV.root
  geo_MC_file: /junofs/users/sindhu/NODA/noda/data/xc_pdfs_2023-08-25.root
  aneu_file: /junofs/users/sindhu/NODA/noda/data/GeoneutrinoCommonInputs.root
  aneu_hist: AlphaN_MC
  nn_file: data/neutron.root
  nn_hist: rec_energy_neutron

  reactor_model: Huber-Mueller

  main_data_folder: /junofs/users/sindhu/NODA/noda/DYB_test_rebinCM
  cov_matrix_plots_folder: /junofs/users/sindhu/NODA/noda/CMplots #folder to store CM plots
  plots_folder: /junofs/users/sindhu/NODA/noda/Plots #folder to save plots of spectra
  data_matrix_folder: /junofs/users/sindhu/NODA/noda/DYB_test_rebinCM #folder to save or to use csv files of spectra and matrices
  bayes_data_folder: /junofs/users/sindhu/NODA/noda/Bayesian/npz_files
  bayes_plots_folder: /junofs/users/sindhu/NODA/noda/Bayesian/Plots

  #start and end points for each parameter in grid space
  grid_params:
    sin2_12: [0.302, 0.312]
    sin2_13: [0.0068, 0.0368]
    dm2_21: [7.47e-5, 7.59e-5]
    dm2_31: [2.515e-3, 2.543e-3]

  #number of points for each parameter in the grid space
  grid_points: 21

  shape_unc: TAO


  bayes_unc: stat #+eff+r2+crel+snf+noneq+b2b_DYB+abc+nl+bg+me

  sample_size_resp: 10000 #000 # Sample size for response matrix fluctuations
  sample_size_core: 10000 # Sample size for core powers fluctuations
  sample_size_nonl: 10000 # Sample size for non-linearity fluctuations
  sample_size_me: 10000 #00 # Sample size for matter effect fluctuations


