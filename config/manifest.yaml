# manifest_P25CD.yaml — top-level entry point for a multi-phase fit.
#
# Three accepted shapes:
#
#   1) Phase only (entire radius fit per phase):
#         P25C: config/P25C_PRL2025.yaml
#         P25D: config/P25D.yaml
#
#   2) Phase + radial shell:
#         P25C:
#           FV1: config/P25C_FV1.yaml
#           FV2: config/P25C_FV2.yaml
#         P25D:
#           FV1: config/P25D_FV1.yaml
#
#   3) One common config + per-phase overrides — only list what changes
#      between phases (livetime, eff, eff_unc, backgrounds, reactor
#      power, detector response file/values, data spectrum). See
#      config/240-day_FV165/manifest_phases.yaml for a full example:
#         common: config/240-day_FV165/AllP_Jun2026.yaml
#         phases:
#           phase1:
#             stat_opt: 57.09735092days
#             detector_efficiency: 0.7046
#             ...
#
# When you mix (some phases have shells, some don't) the no-shell ones
# get shell='ALL'. The single-config legacy run also keeps working.

#P25C: config/P25C_prl2025.yaml
#P2#5D: config/P25D.yaml
AllP: config/240-day_FV165/AllP_Jun2026.yaml 
#groupA: config/240-day_FV165/groupA.yaml
#phase1: config/240-day_FV165/phase1.yaml
#     FV1: config/240-day/phase1.yaml
#     FV2: config/240-day/phase1.yaml
# phase2: 
#     FV1: config/240-day/phase1.yaml
#     FV2: config/240-day/phase1.yaml
# phase3:
#     FV1: config/240-day/phase1.yaml
#     FV2: config/240-day/phase1.yaml
# phase4:
#     FV1: config/240-day/phase4.yaml
#     FV2: config/240-day/phase4.yaml
# ─── Optional override of systematic-correlation policy ────────────────────
# Each base name (or family — 'NL' matches NL0..NL4) maps to
# {correlate_phase, correlate_shell}. Omitted families fall back to the
# defaults in param_policy.DEFAULT_SYSTEMATICS.
#
# Defaults (encoded in code, paraphrased here so it's discoverable):
#   NL, abc, ThU_ratio, efission, shape_nuis  → (true, true)   global
#   Nrea, core_power, snf_noneq_norm          → (false, true)  per phase
#   eff_nuis                                  → (false, false) per (phase, shell)
#
# Uncomment to override any of these:
#
# systematics:
#   eff_nuis:   {correlate_phase: false, correlate_shell: true}   # share eff across shells
#   core_power: {correlate_phase: true,  correlate_shell: true}   # share reactor between phases