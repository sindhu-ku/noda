# background_rates.yaml

JUNO:
  lihe:
    rootfile: "${NODA_BASE}/data/JUNOInputs2022_05_08.root"
    histname: "Li9BkgHistogramAD"
    rate: 0.8
    rate_unc: 0.2
    b2b_unc: 0.1
    b2b_scale: 0.02   # b2b_unc is per 20 keV analysis bin (geo binning 1-7 MeV)
    name: "$^{9}$Li / $^{8}$He"

  geo:
    rootfile: "${NODA_BASE}/data/JUNOInputs2022_05_08.root"
    histname: "GeoNuHistogramAD"
    rate: 1.229 #1.239 #1.147
    rate_unc: 0.0
    b2b_unc: 0.05
    b2b_scale: 0.02   # b2b_unc is per 20 keV analysis bin (geo binning 1-7 MeV)
    name: "Geoneutrinos"
    
  wr:
    rootfile: "${NODA_BASE}/data/JUNOInputs2022_05_08.root" #${NODA_BASE}/data/WR.root" 
    histname: "OtherReactorSpectrum_L300km"
    rate: 1.3 #1.185
    rate_unc: 0.1
    b2b_unc: 0.05
    b2b_scale: 0.02   # b2b_unc is per 20 keV analysis bin (geo binning 1-7 MeV)
    name: "World reactor neutrinos"
    
  # bipo:
  #   rootfile: "${NODA_BASE}/data/JUNOInputs2022_05_08.root" #${NODA_BASE}/data//IBD_bckgs_groupC_Nov10_reprod25C.root" #"${NODA_BASE}/data/ShapeUncWR.root" 
  #   histname: "bipo" #OtherReactorSpectrum_L300km"
  #   rate: 0.264
  #   rate_unc: 0.5
  #   b2b_unc: 0.05
  #   name: "$^{214}$Bi"
    
  acc:
    rootfile: "${NODA_BASE}/data/JUNOInputs2022_05_08.root" #${NODA_BASE}/data/IBD_bckgs_groupC_Jan6_reprod25C.root"
    histname: "AccBkgHistogramAD"
    rate: 0.8
    rate_unc: 0.01
    b2b_unc: 0.0
    b2b_scale: 0.02   # b2b_unc is per 20 keV analysis bin (geo binning 1-7 MeV)
    name: "Accidentals"
   
  # doublen:
  #   rootfile: "${NODA_BASE}/data/IBD_bckgs_groupC_Nov10_reprod25C.root"
  #   histname: "doublen" #FnBkgHistogramAD"
  #   rate: 0.05
  #   rate_unc: 1.0
  #   b2b_unc: 0.15
  #   name: "Double neutrons"

  atm:
    rootfile: "${NODA_BASE}/data/JUNOInputs2022_05_08.root" #${NODA_BASE}/data/AtmNCBkgForReactorNu.root"
    histname: "AtmosphericNeutrinoModelGENIE2"
    rate: 0.16
    rate_unc: 0.5
    b2b_unc: 0.5
    b2b_scale: 0.02   # b2b_unc is per 20 keV analysis bin (geo binning 1-7 MeV)
    name: "Atmospheric neutrinos"

  alphan:
    rootfile: "${NODA_BASE}/data/JUNOInputs2022_05_08.root" #${NODA_BASE}/data/IBD_bckgs_groupC_Nov10_reprod25C.root" #${NODA_BASE}/data/GeoneutrinoCommonInputs.root" #"${NODA_BASE}/data/IBD_bckgs_groupC_Nov10_reprod25C.root"
    histname: "AlphaNBkgHistogramAD"
    rate: 0.090
    rate_unc: 0.25
    b2b_unc: 0.25
    b2b_scale: 0.02   # b2b_unc is per 20 keV analysis bin (geo binning 1-7 MeV)
    name: "$^{13}$C ($\\alpha$, n) $^{16}$O"
    
  fastn:
    rootfile: "${NODA_BASE}/data/JUNOInputs2022_05_08.root" #${NODA_BASE}/data/fastn_shape.root"
    histname: "FnBkgHistogramAD"
    rate: 0.1
    rate_unc: 1.0
    b2b_unc: 0.2
    b2b_scale: 0.02   # b2b_unc is per 20 keV analysis bin (geo binning 1-7 MeV)
    name: "Fast neutrons"

  # Not part of the geo-sensitivity background model: kept at zero rate only
  # because the current code expects every JUNO background (current names).
  doublen:
    rootfile: "${NODA_BASE}/data/IBD_bckgs_groupC_Nov10_reprod25C.root"
    histname: "doublen"
    rate: 1.0e-6   # negligible (cpd); a placeholder at exactly 0 breaks the rate printout
    rate_unc: 1.0
    b2b_unc: 0.0
    b2b_scale: 0.02   # b2b_unc is per 20 keV analysis bin (geo binning 1-7 MeV)
    name: "Double neutrons"

  bipo:
    rootfile: "${NODA_BASE}/data/IBD_bckgs_groupC_Nov10_reprod25C.root"
    histname: "bipo"
    rate: 1.0e-6   # negligible (cpd); a placeholder at exactly 0 breaks the rate printout
    rate_unc: 1.0
    b2b_unc: 0.0
    b2b_scale: 0.02   # b2b_unc is per 20 keV analysis bin (geo binning 1-7 MeV)
    name: "$^{214}$Bi"

TAO:
  lihe:
    rootfile: "${NODA_BASE}/data/IBD_bckgs_groupC_Nov10_reprod25C.root"
    histname: "Li9BkgHistogramAD"
    rate: 54
    rate_unc: 0.2
    b2b_unc: 0.1

  fneu:
    rootfile: "${NODA_BASE}/data/IBD_bckgs_groupC_Nov10_reprod25C.root"
    histname: "FnBkgHistogramAD"
    rate: 86
    rate_unc: 1.0
    b2b_unc: 0.2

  acc:
    rootfile: "${NODA_BASE}/data/IBD_bckgs_groupC_Nov10_reprod25C.root"
    histname: "AccBkgHistogramAD"
    rate: 190
    rate_unc: 0.01
    b2b_unc: 0.0
